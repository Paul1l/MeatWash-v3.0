name: Deploy Meatwash website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Хостинг meatwash.ru (reg.ru): пока секрет FTP_HOST не задан, шаг выкладки пропускается.
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Установить зависимости
        run: npm ci
      # Каталог, превью, js/data.js и общие части страниц сгенерированы и закоммичены
      # (npm run build) — здесь не пересобираются: check падает, если страница
      # разошлась со своим источником.
      - name: Check website assets and code
        run: npm run check
      # Версия к адресам CSS и JS: иначе после выкладки браузер смешивает
      # новый HTML со старыми стилями из кэша (у GitHub Pages max-age=600).
      - name: Stamp asset versions
        run: node scripts/stamp-assets.mjs "${GITHUB_SHA::7}"
      # Из выкладки убираем то, что страница не запрашивает: неиспользуемые
      # логотипы, исходники шрифтов и картинки прошлых версий. В репозитории
      # они остаются.
      - name: Отсеять неиспользуемые файлы
        run: node scripts/prune-deploy.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
      # Тот же dist (с версиями и без лишних файлов) — на хостинг meatwash.ru.
      # Секреты FTP_HOST, FTP_USER, FTP_PASSWORD и переменная FTP_DIR — README, «Домен meatwash.ru».
      - name: Выложить на meatwash.ru (хостинг reg.ru)
        if: env.FTP_HOST != ''
        env:
          FTP_USER: ${{ secrets.FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_DIR: ${{ vars.FTP_DIR || 'www/meatwash.ru' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          bash scripts/deploy-hosting.sh
