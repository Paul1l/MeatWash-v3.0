name: Проверка

# Идёт на каждый pull request в main и в meat-auto (ветки пакетов WP1–WP7) и на каждый
# push в любую ветку, кроме main: в main публикацией и проверкой занимается pages.yml.
# Meat Auto (поправка критика 29): сгенерированные dist/*.html в PR пакетов можно не
# включать (план §6.1), поэтому здесь сначала сборка, потом проверка свежего dist.
on:
  pull_request:
    branches: [main, meat-auto]
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Собрать страницы
        run: npm run build

      - name: Ресурсы, ссылки, мета и данные
        run: npm run check

      - name: 3D-гараж (бандл и модели)
        run: npm run check:3d

      # Проверяющему не нужно поднимать проект у себя: папка сайта
      # прикладывается к запуску, её можно скачать и открыть локально.
      - name: Приложить собранный сайт
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ github.sha }}
          path: dist
          retention-days: 14
